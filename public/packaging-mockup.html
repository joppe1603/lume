<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAUYI — Packaging Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D0B09;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      font-family: 'Inter', sans-serif;
    }
    .grain {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 50; opacity: 0.04;
    }
    .ambient {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 1100px; height: 600px;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,169,110,0.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .mockup-svg {
      width: 100%;
      max-width: 860px;
      height: auto;
    }
    .caption {
      margin-top: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .cap-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(245,242,236,0.22);
      font-weight: 300;
    }
    .cap-product {
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(201,169,110,0.38);
      font-weight: 400;
    }
    .dl-btn {
      margin-top: 28px;
      padding: 10px 24px;
      border: 1px solid rgba(201,169,110,0.18);
      border-radius: 100px;
      background: transparent;
      color: rgba(201,169,110,0.5);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'Inter', sans-serif;
    }
    .dl-btn:hover { border-color: rgba(201,169,110,0.45); color: #C9A96E; }
  </style>
</head>
<body>

  <svg class="grain" aria-hidden>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>
  <div class="ambient"></div>

  <!--
    ISOMETRIC BOX  W=175  D=95  H=250
    iso right  = (+0.866, +0.5)
    iso depth  = (−0.866, +0.5)
    iso up     = (0, −1)
    Anchor P1 (front-bottom-left) = (270, 358)

    P1  front-bottom-left   = (270, 358)
    P2  front-bottom-right  = (270+152, 358+88)  = (422, 446)
    P3  back-bottom-left    = (270−82,  358+48)  = (188, 406)
    P4  back-bottom-right   = (422−82,  446+48)  = (340, 494)  ← surface
    P5  front-top-left      = (270, 108)
    P6  front-top-right     = (422, 196)
    P7  back-top-left       = (188, 156)
    P8  back-top-right      = (340, 244)

    Bottle  cx=570  body x 538–606 (w=68)  y 60–478
  -->

  <svg class="mockup-svg" viewBox="0 0 860 540" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Box faces -->
      <linearGradient id="gFront" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#201C16"/>
        <stop offset="100%" stop-color="#171410"/>
      </linearGradient>
      <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#0D0B09"/>
        <stop offset="100%" stop-color="#0A0908"/>
      </linearGradient>
      <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#332E24"/>
        <stop offset="100%" stop-color="#22201A"/>
      </linearGradient>

      <!-- Bottle glass -->
      <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#5A2E0E" stop-opacity="0.48"/>
        <stop offset="12%"  stop-color="#8B5028" stop-opacity="0.66"/>
        <stop offset="28%"  stop-color="#C07840" stop-opacity="0.78"/>
        <stop offset="44%"  stop-color="#D99A56" stop-opacity="0.85"/>
        <stop offset="54%"  stop-color="#E6AA62" stop-opacity="0.88"/>
        <stop offset="70%"  stop-color="#C88844" stop-opacity="0.79"/>
        <stop offset="86%"  stop-color="#9A5E28" stop-opacity="0.62"/>
        <stop offset="100%" stop-color="#582608" stop-opacity="0.44"/>
      </linearGradient>
      <linearGradient id="gLiquid" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#2E1408" stop-opacity="0.40"/>
        <stop offset="42%"  stop-color="#5A3018" stop-opacity="0.52"/>
        <stop offset="62%"  stop-color="#663820" stop-opacity="0.48"/>
        <stop offset="100%" stop-color="#2A1006" stop-opacity="0.36"/>
      </linearGradient>
      <linearGradient id="gHilight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="white" stop-opacity="0.15"/>
        <stop offset="60%"  stop-color="white" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>

      <!-- Gold -->
      <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#7A5220"/>
        <stop offset="20%"  stop-color="#B88838"/>
        <stop offset="44%"  stop-color="#D4A858"/>
        <stop offset="55%"  stop-color="#EAC870"/>
        <stop offset="80%"  stop-color="#C09038"/>
        <stop offset="100%" stop-color="#7A5220"/>
      </linearGradient>
      <linearGradient id="gGoldV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#C09030"/>
        <stop offset="35%"  stop-color="#D4A84A"/>
        <stop offset="65%"  stop-color="#B88828"/>
        <stop offset="100%" stop-color="#7A5010"/>
      </linearGradient>

      <!-- Label -->
      <linearGradient id="gLabel" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#080706" stop-opacity="0.96"/>
        <stop offset="12%"  stop-color="#0A0908" stop-opacity="0.98"/>
        <stop offset="88%"  stop-color="#0A0908" stop-opacity="0.98"/>
        <stop offset="100%" stop-color="#080706" stop-opacity="0.96"/>
      </linearGradient>

      <!-- Shadows -->
      <radialGradient id="gShBox" cx="50%" cy="20%" r="60%">
        <stop offset="0%"   stop-color="rgba(0,0,0,0.60)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>
      <radialGradient id="gShBottle" cx="50%" cy="20%" r="60%">
        <stop offset="0%"   stop-color="rgba(0,0,0,0.65)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>
    </defs>

    <!-- Cast shadows -->
    <ellipse cx="295" cy="496" rx="165" ry="16" fill="url(#gShBox)"    opacity="0.9"/>
    <ellipse cx="572" cy="488" rx="48"  ry="12" fill="url(#gShBottle)" opacity="0.95"/>

    <!-- ═══ ISOMETRIC BOX ═══ -->

    <!-- Right face (darkest) -->
    <polygon points="422,446 340,494 340,244 422,196" fill="url(#gRight)"/>

    <!-- Front face -->
    <polygon points="270,358 422,446 422,196 270,108" fill="url(#gFront)"/>

    <!-- Top face (lightest) -->
    <polygon points="270,108 422,196 340,244 188,156" fill="url(#gTop)"/>

    <!-- Edge highlights (light catching corners) -->
    <line x1="270" y1="108" x2="422" y2="196" stroke="rgba(201,169,110,0.35)" stroke-width="0.9"/>
    <line x1="270" y1="108" x2="188" y2="156" stroke="rgba(201,169,110,0.20)" stroke-width="0.6"/>
    <line x1="270" y1="108" x2="270" y2="358" stroke="rgba(201,169,110,0.15)" stroke-width="0.5"/>

    <!-- Inset border on front -->
    <polygon points="279,364 413,450 413,202 279,116"
             fill="none" stroke="rgba(201,169,110,0.10)" stroke-width="0.7"/>

    <!-- ══ FRONT FACE TEXT ══════════════
         matrix(a,b,0,1, P5.x, P5.y)
         a = (422−270)/175 = 0.869
         b = (196−108)/175 = 0.503
         origin = P5 = (270, 108)
    ════════════════════════════════ -->
    <g transform="matrix(0.869,0.503,0,1,270,108)">

      <text x="87" y="26" text-anchor="middle"
            font-family="Inter,sans-serif" font-size="5.5" font-weight="600" letter-spacing="2.8"
            fill="#C9A96E" opacity="0.52">NIGHT RESET RITUAL</text>

      <text x="87" y="80" text-anchor="middle"
            font-family="Cormorant Garamond,serif" font-size="32" font-weight="300" letter-spacing="11"
            fill="#F2EDE4" opacity="0.90">MAUYI</text>

      <line x1="50" y1="92" x2="124" y2="92" stroke="#C9A96E" stroke-width="0.45" opacity="0.36"/>

      <text x="87" y="107" text-anchor="middle"
            font-family="Inter,sans-serif" font-size="6.2" font-weight="400" letter-spacing="3.8"
            fill="rgba(242,237,228,0.44)">RESET SERUM</text>

      <path d="M80,124 A9,9 0 0 1 92,114 A6,6 0 0 0 80,124z" fill="#C9A96E" opacity="0.30"/>

      <text x="87" y="150" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.2" font-weight="300" letter-spacing="1.8" fill="rgba(201,169,110,0.40)">Retinol 0.3%</text>
      <text x="87" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.2" font-weight="300" letter-spacing="1.8" fill="rgba(201,169,110,0.36)">Niacinamide 10%</text>
      <text x="87" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.2" font-weight="300" letter-spacing="1.8" fill="rgba(201,169,110,0.32)">Bakuchiol 0.5%</text>
      <text x="87" y="195" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.2" font-weight="300" letter-spacing="1.8" fill="rgba(201,169,110,0.26)">Hyaluronzuur ×3</text>

      <text x="12"  y="243" font-family="Inter,sans-serif" font-size="4.5" font-weight="300" letter-spacing="1.2" fill="rgba(242,237,228,0.14)">NL · mauyi.nl</text>
      <text x="162" y="243" text-anchor="end" font-family="Inter,sans-serif" font-size="4.5" font-weight="300" letter-spacing="1.8" fill="rgba(242,237,228,0.14)">30 ML</text>
    </g>

    <!-- ══ SIDE FACE TEXT ══════════════
         matrix(−0.863, 0.505, 0, 1, P6.x, P6.y)
         = matrix(−0.863, 0.505, 0, 1, 422, 196)
    ════════════════════════════════ -->
    <g transform="matrix(-0.863,0.505,0,1,422,196)">
      <g transform="translate(47,125) rotate(-90)">
        <text x="0" y="0" text-anchor="middle"
              font-family="Cormorant Garamond,serif"
              font-size="8" font-weight="300" letter-spacing="4"
              fill="rgba(242,237,228,0.20)">MAUYI · RESET SERUM · 30 ML</text>
      </g>
    </g>

    <!-- ═══ DROPPER BOTTLE ═══
         cx=572  body x 538–606 (w=68)  y top=60 bottom=480
    ════════════════════════════ -->

    <!-- Dropper tip -->
    <rect x="568" y="60" width="8" height="26" rx="4" fill="url(#gGold)"/>

    <!-- Rubber bulb -->
    <ellipse cx="572" cy="106" rx="18" ry="22"  fill="#181310"/>
    <ellipse cx="572" cy="106" rx="18" ry="22"  fill="none" stroke="rgba(201,169,110,0.18)" stroke-width="0.7"/>
    <ellipse cx="565"  cy="97"  rx="4"  ry="6.5" fill="white" opacity="0.025"/>

    <!-- Top collar -->
    <rect x="564" y="128" width="16" height="6"  rx="2" fill="url(#gGold)"/>
    <rect x="564" y="128" width="16" height="2"  rx="1" fill="rgba(255,255,255,0.07)"/>

    <!-- Knurled cap -->
    <rect x="558" y="134" width="28" height="28" rx="3" fill="url(#gGoldV)"/>
    <line x1="562" y1="135" x2="562" y2="161" stroke="rgba(0,0,0,0.15)" stroke-width="0.7"/>
    <line x1="566" y1="135" x2="566" y2="161" stroke="rgba(0,0,0,0.15)" stroke-width="0.7"/>
    <line x1="570" y1="135" x2="570" y2="161" stroke="rgba(0,0,0,0.15)" stroke-width="0.7"/>
    <line x1="574" y1="135" x2="574" y2="161" stroke="rgba(0,0,0,0.15)" stroke-width="0.7"/>
    <line x1="578" y1="135" x2="578" y2="161" stroke="rgba(0,0,0,0.15)" stroke-width="0.7"/>
    <line x1="582" y1="135" x2="582" y2="161" stroke="rgba(0,0,0,0.15)" stroke-width="0.7"/>
    <rect x="558" y="134" width="28" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="558" y="159" width="28" height="3" rx="1.5" fill="url(#gGold)" opacity="0.85"/>

    <!-- Neck taper -->
    <path d="M562,162 L538,176 L606,176 L582,162 Z" fill="url(#gGold)" opacity="0.72"/>

    <!-- Glass body -->
    <rect x="538" y="176" width="68" height="296" rx="5"   fill="url(#gGlass)"/>
    <rect x="544" y="182" width="56" height="284" rx="3.5" fill="url(#gLiquid)"/>
    <!-- Left/right edge shading -->
    <rect x="538" y="176" width="10" height="296" rx="4"  fill="rgba(0,0,0,0.22)"/>
    <rect x="596" y="176" width="10" height="296" rx="4"  fill="rgba(0,0,0,0.30)"/>
    <!-- Primary highlight -->
    <rect x="546" y="182" width="7"  height="258" rx="3.5" fill="url(#gHilight)"/>
    <!-- Faint secondary -->
    <rect x="557" y="188" width="2.5" height="198" rx="1.2" fill="rgba(255,255,255,0.022)"/>
    <!-- Base -->
    <rect x="538" y="464" width="68" height="8" rx="3"  fill="rgba(55,26,8,0.42)"/>
    <rect x="540" y="465" width="64" height="2" rx="1"  fill="rgba(255,255,255,0.022)"/>

    <!-- Label -->
    <rect x="541" y="215" width="62" height="140" rx="2.5" fill="url(#gLabel)"/>
    <rect x="544" y="218" width="56" height="134" rx="1.5" fill="none" stroke="rgba(201,169,110,0.14)" stroke-width="0.5"/>

    <text x="572" y="239" text-anchor="middle"
          font-family="Cormorant Garamond,serif" font-size="12.5" font-weight="300" letter-spacing="5.5"
          fill="#EDE8DF" opacity="0.86">MAUYI</text>
    <line x1="556" y1="245" x2="588" y2="245" stroke="#C9A96E" stroke-width="0.4" opacity="0.36"/>
    <text x="572" y="255" text-anchor="middle"
          font-family="Inter,sans-serif" font-size="5" font-weight="500" letter-spacing="3"
          fill="#C9A96E" opacity="0.56">RESET SERUM</text>

    <path d="M568,264 A5,5 0 0 1 575,258 A3.5,3.5 0 0 0 568,264z" fill="#C9A96E" opacity="0.30"/>

    <text x="572" y="279" text-anchor="middle" font-family="Inter,sans-serif" font-size="4" font-weight="300" letter-spacing="0.8" fill="rgba(242,237,228,0.26)">Retinol 0.3% · Niacinamide 10%</text>
    <text x="572" y="288" text-anchor="middle" font-family="Inter,sans-serif" font-size="4" font-weight="300" letter-spacing="0.8" fill="rgba(242,237,228,0.20)">Bakuchiol 0.5% · Hyaluronzuur ×3</text>
    <text x="572" y="302" text-anchor="middle" font-family="Inter,sans-serif" font-size="3.8" font-weight="500" letter-spacing="2.5" fill="rgba(201,169,110,0.30)">PARFUMVRIJ</text>
    <text x="572" y="344" text-anchor="middle" font-family="Inter,sans-serif" font-size="4" font-weight="300" letter-spacing="1.8" fill="rgba(242,237,228,0.14)">30 ML · 1 FL.OZ</text>

    <!-- Surface line -->
    <line x1="80" y1="498" x2="780" y2="498" stroke="rgba(201,169,110,0.06)" stroke-width="0.8"/>
  </svg>

  <div class="caption">
    <div class="cap-brand">Mauyi Skincare</div>
    <div class="cap-product">Reset Serum &mdash; Night Reset Ritual &mdash; 30 ml</div>
  </div>

  <button class="dl-btn" onclick="downloadMockup()">↓ Download PNG</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    async function downloadMockup() {
      const btn = document.querySelector('.dl-btn')
      btn.textContent = 'Renderen...'
      try {
        const canvas = await html2canvas(document.body, {
          backgroundColor: '#0D0B09', scale: 2, useCORS: true, logging: false,
        })
        const a = document.createElement('a')
        a.download = 'mauyi-packaging.png'
        a.href = canvas.toDataURL('image/png')
        a.click()
      } finally { btn.textContent = '↓ Download PNG' }
    }
  </script>
</body>
</html>
